<title>結の札｜一枚の札から、物語がひらく。</title>

<style>
:root {
    --bg: #080c14;
    --bg-soft: #101725;
    --paper: #eee4d2;
    --ink: #24211d;
    --text: #eadfce;
    --muted: #9b978f;
    --gold: #c9aa63;
    --gold-soft: rgba(201,170,99,.35);
    --line: rgba(201,170,99,.35);
    --shadow: rgba(0,0,0,.55);

    --serif:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;

    --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
}

body {
    color: var(--text);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
}

/* =========================
   STAGE
========================= */

#app {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(44,55,78,.22),
            transparent 60%
        ),
        var(--bg);
}

/* =========================
   SCENES
========================= */

.scene {
    position: absolute;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding:
        max(28px, env(safe-area-inset-top))
        24px
        max(28px, env(safe-area-inset-bottom));

    text-align: center;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transform: scale(1.015);

    transition:
        opacity .65s ease,
        transform .8s cubic-bezier(.22,.61,.36,1),
        visibility .65s;
}

.scene.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: scale(1);
}

.scene.leaving {
    opacity: 0;
    transform: scale(.985);
}

/* =========================
   TYPOGRAPHY
========================= */

h1 {
    font-size: clamp(3rem, 15vw, 5.5rem);
    font-weight: 400;
    letter-spacing: .12em;
    color: var(--gold);
}

h2 {
    font-size: clamp(1.7rem, 7vw, 2.6rem);
    font-weight: 400;
    color: var(--gold);
    letter-spacing: .08em;
}

p {
    max-width: 620px;
}

.lead {
    font-size: clamp(1rem, 4vw, 1.2rem);
    line-height: 2;
}

.small {
    color: var(--muted);
    font-family: var(--sans);
    font-size: .75rem;
    letter-spacing: .14em;
}

.eyebrow {
    color: var(--gold);
    font-family: var(--sans);
    font-size: .68rem;
    letter-spacing: .22em;
    margin-bottom: 18px;
}

.story {
    width: min(88vw, 520px);
    font-size: clamp(.98rem, 4.1vw, 1.12rem);
    line-height: 2.05;
    white-space: pre-line;
    text-align: left;
}

.quote {
    color: var(--gold);
    font-size: 1.05rem;
    line-height: 2;
}

/* =========================
   BUTTON
========================= */

button {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(10,14,23,.35);
    color: var(--gold);

    min-height: 46px;
    padding: 10px 28px;

    font-family: var(--serif);
    font-size: .95rem;

    cursor: pointer;

    transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
}

button:active {
    transform: scale(.97);
}

button:hover {
    background: rgba(201,170,99,.08);
    border-color: var(--gold);
}

button.secondary {
    border-color: rgba(255,255,255,.15);
    color: #aaa;
}

.button-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 28px;
    width: min(84vw, 320px);
}

/* =========================
   INPUT
========================= */

.text-input {
    width: min(86vw, 430px);

    border: none;
    border-bottom: 1px solid rgba(201,170,99,.45);

    background: transparent;

    color: var(--text);

    font-family: var(--serif);
    font-size: 1.05rem;

    text-align: center;

    padding: 12px 8px;
    margin-top: 25px;

    outline: none;
}

.text-input:focus {
    border-bottom-color: var(--gold);
}

.text-input::placeholder {
    color: #686761;
}

/* =========================
   HOME
========================= */

.home-mark {
    width: 80px;
    height: 80px;
    border: 1px solid var(--gold-soft);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 30px;

    color: var(--gold);
    font-size: 1.2rem;
}

/* =========================
   LIBRARY
========================= */
